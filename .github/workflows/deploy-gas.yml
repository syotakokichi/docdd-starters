name: Deploy GAS

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/gas/progress-sync/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Setup clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Setup project config
        run: |
          cd scripts/gas/progress-sync
          echo '{
            "scriptId": "${{ secrets.GAS_SCRIPT_ID }}",
            "rootDir": "./src",
            "fileExtension": "gs"
          }' > .clasp.json

      - name: Push to GAS
        run: |
          cd scripts/gas/progress-sync
          clasp push --force

name: docdd-starters CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
        working-directory: apps/frontend
      - name: Install backend dev dependencies
        run: pip install -r apps/backend/requirements-dev.txt
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --config .pre-commit-config.yaml

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r apps/backend/requirements-dev.txt
      - name: Run backend tests
        run: PYTHONPATH=apps/backend pytest tests/backend

  shell-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install shfmt
        run: |
          curl -sS https://webi.sh/shfmt | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
      - name: Install jq
        run: sudo apt-get install -y -qq jq
      - name: shellcheck
        run: make shell-lint
      - name: shfmt
        run: make shell-format-check
      - name: bats
        run: make test-hooks
      - name: Harness regression
        run: make test-harness

  docdd-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Validate Claude config
        run: make validate-claude
      - name: Validate Claude config (strict)
        run: make validate-claude-strict
      - name: Validate traceability
        run: make traceability

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json
      - name: Install dependencies
        run: npm install
        working-directory: apps/frontend
      - name: Biome lint
        run: npm run lint:biome
        working-directory: apps/frontend
      - name: Private folder check
        run: npm run check:segments
        working-directory: apps/frontend
      - name: Frontend unit tests
        run: npm run test:unit
        working-directory: apps/frontend
